<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Borosilicate beaker set with graduated markings">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#0D131A"/>
  <ellipse cx="200" cy="160" rx="170" ry="120" fill="url(#glow1)"/>

  <!-- graduated cylinder -->
  <rect x="296" y="66" width="44" height="184" rx="8" fill="url(#g1)" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/>
  <rect x="300" y="150" width="36" height="96" rx="6" fill="url(#l1)"/>
  <rect x="290" y="58" width="56" height="10" rx="5" fill="#33404F"/>
  <g stroke="#FFFFFF" stroke-opacity=".3" stroke-width="2">
    <line x1="310" y1="96" x2="330" y2="96"/>
    <line x1="310" y1="116" x2="330" y2="116"/>
    <line x1="310" y1="136" x2="330" y2="136"/>
    <line x1="310" y1="156" x2="330" y2="156"/>
    <line x1="310" y1="176" x2="330" y2="176"/>
  </g>

  <!-- small beaker -->
  <path d="M74 150 L74 228 Q74 244 90 244 L146 244 Q162 244 162 228 L162 150" fill="url(#g1)" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/>
  <path d="M79 190 L79 230 Q79 239 88 239 L148 239 Q157 239 157 230 L157 190 Z" fill="url(#l1)"/>
  <line x1="70" y1="150" x2="166" y2="150" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>

  <!-- big beaker -->
  <path d="M176 88 L176 226 Q176 246 196 246 L252 246 Q272 246 272 226 L272 88" fill="url(#g1)" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="2"/>
  <path d="M182 164 L182 228 Q182 240 194 240 L254 240 Q266 240 266 228 L266 164 Z" fill="url(#l1)"/>
  <line x1="170" y1="88" x2="278" y2="88" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>
  <g stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2">
    <line x1="246" y1="120" x2="266" y2="120"/>
    <line x1="246" y1="148" x2="266" y2="148"/>
    <line x1="240" y1="200" x2="266" y2="200"/>
  </g>
  <rect x="186" y="96" width="7" height="140" rx="3.5" fill="#FFFFFF" opacity=".1"/>
  <line x1="60" y1="248" x2="340" y2="248" stroke="#232C38" stroke-width="2"/>
</svg>
