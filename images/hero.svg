<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="Three LabSupply reagent vials standing on a dark bench">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33404F"/>
      <stop offset=".45" stop-color="#5A6A7E"/>
      <stop offset="1" stop-color="#2A3441"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <symbol id="vial" viewBox="-60 -170 120 330">
      <rect x="-30" y="-168" width="60" height="26" rx="8" fill="url(#metal)"/>
      <rect x="-30" y="-168" width="60" height="7" rx="3.5" fill="#8294A8" opacity=".45"/>
      <rect x="-22" y="-144" width="44" height="14" fill="#FFFFFF" opacity=".1"/>
      <rect x="-46" y="-132" width="92" height="292" rx="22" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>
      <rect x="-38" y="-30" width="76" height="176" rx="14" fill="url(#liquid)"/>
      <rect x="-38" y="-30" width="76" height="4" rx="2" fill="#99F6E4" opacity=".75"/>
      <rect x="-48" y="-76" width="96" height="128" rx="6" fill="#EDF3F8"/>
      <rect x="-34" y="-60" width="52" height="7" rx="3.5" fill="#0B0F14" opacity=".6"/>
      <rect x="-34" y="-46" width="68" height="4" rx="2" fill="#0B0F14" opacity=".3"/>
      <rect x="-34" y="-36" width="44" height="4" rx="2" fill="#0B0F14" opacity=".3"/>
      <rect x="-34" y="-18" width="68" height="22" rx="4" fill="#2DD4BF" opacity=".85"/>
      <rect x="-34" y="14" width="30" height="4" rx="2" fill="#0B0F14" opacity=".28"/>
      <rect x="-30" y="-116" width="8" height="252" rx="4" fill="#FFFFFF" opacity=".12"/>
    </symbol>
  </defs>

  <rect x="8" y="8" width="704" height="604" rx="24" fill="#0E141B" stroke="#232C38"/>
  <ellipse cx="360" cy="340" rx="260" ry="230" fill="url(#glow)"/>

  <ellipse cx="180" cy="576" rx="86" ry="12" fill="#000000" opacity=".55" filter="url(#soft)"/>
  <ellipse cx="368" cy="580" rx="96" ry="13" fill="#000000" opacity=".55" filter="url(#soft)"/>
  <ellipse cx="552" cy="570" rx="80" ry="11" fill="#000000" opacity=".5" filter="url(#soft)"/>

  <use href="#vial" x="104" y="186" width="152" height="390" opacity=".95"/>
  <use href="#vial" x="284" y="126" width="170" height="454"/>
  <use href="#vial" x="474" y="206" width="140" height="364" opacity=".92"/>

  <line x1="64" y1="580" x2="656" y2="580" stroke="#232C38" stroke-width="2"/>
  <circle cx="618" cy="120" r="3" fill="#2DD4BF" opacity=".8"/>
  <circle cx="96" cy="196" r="2.5" fill="#2DD4BF" opacity=".5"/>
  <circle cx="648" cy="300" r="2" fill="#2DD4BF" opacity=".35"/>
</svg>
